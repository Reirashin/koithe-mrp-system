# ============================================================================
# 1. CẤU HÌNH ỨNG DỤNG & CỔNG SERVER
# ============================================================================
spring.application.name=mrp-koithe
server.port=8081
spring.profiles.active=local

# ============================================================================
# 2. CẤU HÌNH KẾT NỐI POSTGRESQL (Database: mrp_koithe trên cổng 5432)
# ============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/mrp_koithe
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================================
# 3. CẤU HÌNH SPRING DATA JPA & HIBERNATE
# ============================================================================
# Bắt buộc đối chiếu Entity khớp 100% với 13 bảng đã tạo ở Phase 1, không tự sửa bảng
spring.jpa.hibernate.ddl-auto=validate

# In câu lệnh SQL ra Console để dễ theo dõi & gỡ lỗi
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Đồng bộ múi giờ Việt Nam (UTC+7) cho các cột TIMESTAMP (NgayLap, NgayHT, NgayDuyet)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ============================================================================
# 4. CẤU HÌNH CORS (Cho phép Frontend gọi API)
# ============================================================================
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173